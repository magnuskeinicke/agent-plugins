sources:
  - id: kramme-cc-workflow-agents
    url: https://github.com/Abildtoft/kramme-cc-workflow/tree/main/kramme-cc-workflow/agents
    title: "kramme-cc-workflow — reviewer agent definitions"
    rationale: >
      All 25 agent definition files in this directory are vendored from
      kramme-cc-workflow (MIT, Copyright (c) 2026 Abildtoft). Filenames and
      frontmatter `name:` fields drop the `kramme:` prefix so they surface
      under this plugin's namespace; bodies are otherwise verbatim, except
      codebase-pattern-reviewer.md, which adds a magnus-only "diff reuse audit
      mode" section, and comment-analyzer.md, which adds a magnus-only
      "Prefer a Better Name Over a Comment" check plus a blocking-severity
      rule (both marked inline). One file serves both runtimes: Claude
      spawns it as a subagent definition, Codex uses its body as the
      `codex exec` child's system prompt. The engine's roster mapping lives in
      engine/lib/roster.mjs.
    usage: vendored
    vendored_ref: 56c49f34ce70a8a9be10f08bd91ea6d4e732a384
    vendored_version: "0.77.0"
    license: MIT
    last_reviewed_at: 2026-08-28
  - id: kramme-copy-review-rubric
    url: https://github.com/Abildtoft/kramme-cc-workflow/blob/56c49f34ce70a8a9be10f08bd91ea6d4e732a384/kramme-cc-workflow/skills/kramme%3Acode%3Acopy-review/references/copy-review-rubric.md
    title: "kramme-cc-workflow — copy review rubric"
    rationale: >
      Vendored verbatim into agents/references/copy-review-rubric.md and
      injected into every copy-reviewer task. The engine adds only the JSON
      schema mapping needed by this plugin's findings loop.
    usage: vendored
    vendored_ref: 56c49f34ce70a8a9be10f08bd91ea6d4e732a384
    vendored_version: "0.77.0"
    license: MIT
    last_reviewed_at: 2026-09-15

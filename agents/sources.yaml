sources:
  - id: kramme-cc-workflow-agents
    url: https://github.com/Abildtoft/kramme-cc-workflow/tree/main/trackbed/agents
    title: "trackbed (formerly kramme-cc-workflow) — reviewer agent definitions"
    rationale: >
      All 21 agent definition files in this directory are vendored from
      trackbed, the renamed kramme-cc-workflow (MIT, Copyright (c) 2026
      Abildtoft). Filenames and frontmatter `name:` fields drop the namespace
      prefix so they surface under this plugin's namespace, and `model:
      inherit` is pinned to `model: opus` + `effort: medium` (the engine's
      Claude `reviewer` role; design-iterator, a writer, keeps `effort: high`). Bodies are otherwise verbatim, except
      codebase-pattern-reviewer.md, which adds a magnus-only "diff reuse audit
      mode" section (and a description clause naming it), and
      comment-analyzer.md, which adds a magnus-only "Prefer a Better Name Over
      a Comment" check plus a blocking-severity rule (both marked inline).
      The 14 roster agents and pr-relevance-validator.md also end with a
      marked magnus-only "Persona Proof" section: the engine rejects a loop
      report whose `persona` is not `magnus:<id>`.
      cold-reader.md is new in this refresh and is not yet used by any skill.
      One file serves both runtimes: Claude spawns it as a subagent
      definition, Codex uses its body as the `codex exec` child's system
      prompt. The engine's roster mapping lives in engine/lib/roster.mjs.
    usage: vendored
    vendored_ref: 5b9cb7d53bf88336c14cf958ccbf2f6d88ead67a
    vendored_version: "1.0.1"
    license: MIT
    last_reviewed_at: 2026-11-13
  - id: kramme-copy-review-rubric
    url: https://github.com/Abildtoft/kramme-cc-workflow/blob/f493eee798fdcc8aedff6dd4ed894671f16d642b/kramme-cc-workflow/skills/kramme%3Acode%3Acopy-review/references/copy-review-rubric.md
    title: "kramme-cc-workflow — copy review rubric"
    rationale: >
      Vendored verbatim into agents/references/copy-review-rubric.md and
      injected into every copy-reviewer task. The engine adds only the JSON
      schema mapping needed by this plugin's findings loop.
    usage: vendored
    vendored_ref: f493eee798fdcc8aedff6dd4ed894671f16d642b
    vendored_version: "0.88.0"
    license: MIT
    last_reviewed_at: 2026-10-20
  - id: kramme-cc-workflow-review-skills
    url: https://github.com/Abildtoft/kramme-cc-workflow/tree/f493eee798fdcc8aedff6dd4ed894671f16d642b/kramme-cc-workflow
    title: "kramme-cc-workflow — PR reviewer skills and their shared scripts"
    rationale: >
      Vendored near-verbatim so the plugin can review someone else's pull
      request: skills/github-review (kramme:pr:github-review),
      skills/linear-review-pr (kramme:linear:review-pr),
      skills/pr-code-review (kramme:pr:code-review),
      skills/pr-product-review (kramme:pr:product-review), skills/humanize
      (kramme:text:humanize) and skills/adversarial-review
      (kramme:pr:adversarial-review — refreshed separately, see the
      trackbed-adversarial-review entry), plus the files they load from the plugin root:
      scripts/{collect-review-diff,resolve-base,review-tree-fingerprint,verify-rewrite-state}.sh,
      scripts/lib/, scripts/dev-server/, hooks/confirm-review-artifacts.txt,
      shared/pr-review/references/model-selection.md and
      shared/architecture/references/architecture-language.md. The only edits:
      vendored skill and agent names are rewritten from `kramme:` to
      `magnus:`, frontmatter `name:` drops the namespace, and each SKILL.md
      gets one note under its title covering this provenance, the Codex
      plugin-root and reviewer-launch fallbacks, and upstream-only `kramme:*`
      skill mentions. Three magnus additions are marked inline: github-review
      takes `--adversarial` and runs adversarial-review as a fourth pass; the
      adversarial runner defaults its model and effort to the engine's
      `reviewer` role; and shared/pr-review/references/model-selection.md
      pins every review subagent to that role (Claude opus / Codex
      gpt-6.2-sol, both high) instead of inheriting the session model. One
      fix: adversarial-review's assets/review-result.schema.json drops the
      findings `allOf` (OpenAI strict structured output rejects it); the
      runner's own jq check still enforces the severity/action pairing.
      Three more fixes came from the first adversarial run on this vendoring:
      github-review creates its worktree with hooks disabled;
      pr-code-review and pr-product-review ignore a git-tracked previous
      report; and pr-code-review always launches the slop meta-review, as
      its execution contract requires.
      Each skill's own references/sources.yaml is upstream's
      record of its sources.
    usage: vendored
    vendored_ref: f493eee798fdcc8aedff6dd4ed894671f16d642b
    vendored_version: "0.88.0"
    license: MIT
    last_reviewed_at: 2026-10-20
  - id: trackbed-adversarial-review
    url: https://github.com/Abildtoft/kramme-cc-workflow/tree/5b9cb7d53bf88336c14cf958ccbf2f6d88ead67a/trackbed/skills/pr%3Aadversarial-review
    title: "trackbed — pr:adversarial-review (Gate 5 of pr:review-convergence)"
    rationale: >
      skills/adversarial-review (SKILL.md, scripts/run-adversarial-review.sh,
      references/sources.yaml) refreshed from trackbed 1.0.1 so the engine's
      Gate 5 runs upstream's hardened runner: restricted PATH, per-run prompt
      region tokens, Codex isolation overrides, and the Conductor cloud
      session mode. Magnus edits, marked inline: the Model Invocation Contract
      names the engine convergence loop and the repo's `adversarial.enabled`
      config as the standing opt-in (upstream: the user's
      `--adversarial-review` flag); the runner takes model and effort from
      the engine `reviewer` role and passes the effort to every provider; it
      reads a Codex session's `agentMessage` reply from the Conductor
      transcript (upstream matched only `assistant`, so cloud Codex reviews
      always blocked); a cloud Codex reviewer may inspect files with
      non-mutating commands (upstream forbade all commands, leaving it the
      patch text alone); the
      result schema keeps this plugin's dropped findings `allOf` (OpenAI
      strict output rejects it). The convergence policy itself
      (trackbed skills/pr:review-convergence, Gate 5 rules: run after a
      converged pass, attest the final tree, revalidate untrusted findings,
      disagreements decided outside the fixer, fail closed) is ported into
      engine/lib/adversarial.mjs and engine/cli.mjs rather than vendored;
      upstream's user decision on a disagreement becomes the engine
      adjudicator, because this pipeline has no human gate after the grill.
    usage: vendored
    vendored_ref: 5b9cb7d53bf88336c14cf958ccbf2f6d88ead67a
    vendored_version: "1.0.1"
    license: MIT
    last_reviewed_at: 2026-11-13
